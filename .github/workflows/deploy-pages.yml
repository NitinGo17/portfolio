name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Static preview build. Next's static export cannot include route
      # handlers, so the API is set aside here. The dynamic API ships with
      # the server deployment (Netlify), not this preview.
      - name: Set API aside for static export
        run: mv src/app/api "$RUNNER_TEMP/api"

      - name: Build static export
        run: npx next build
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_SITE_URL: "https://nitingo17.github.io/portfolio"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
